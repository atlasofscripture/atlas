id: john_mark
name: John Mark
altNames: ["Mark", "John"]
bornAt: 5
diedAt: 68
birthplaceId: jerusalem
residenceId: jerusalem
role: Companion of Paul and Barnabas; traditional author of Mark's Gospel
summary: >
  A young companion who joined Paul and Barnabas at the start of their first
  missionary journey but turned back at Perga, returning to Jerusalem. The
  reason for his departure is not given. The dispute over whether to take him
  again later split Paul and Barnabas.

  - { book: "Acts", chapter: 13, verse: 13, note: "Departure at Perga" }
  - { book: "Acts", chapter: 15, verse: 37 }
  - { book: "2 Timothy", chapter: 4, verse: 11, note: "Later reconciliation with Paul" }

id: paul_first_journey
name: Paul's First Missionary Journey
color: "#e8a838"
startYear: 46
endYear: 48
summary: >
  Paul and Barnabas, set apart by the church at Antioch, traveled through
  Cyprus and the southern interior of Asia Minor proclaiming the gospel.
  The journey established Christian communities in Pisidian Antioch,
  Iconium, Lystra, and Derbe, and set the stage for the Jerusalem Council
  on Gentile inclusion.
